<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>How 4–20 mA Signals Work | ControlsCalc</title><link rel="stylesheet" href="../style.css"></head><body><main class="wrap calc"><h1>How 4–20 mA Signals Work</h1><p>A 4–20 mA loop commonly represents a process variable using current. 4 mA is the live-zero endpoint and 20 mA is the upper range endpoint.</p><h2>Basic scaling</h2><p>Fraction of span = (mA − 4) ÷ 16.</p><p><a href="../calculators/4-20ma-scaling.html">Use the calculator →</a></p></main></body></html>
